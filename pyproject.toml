[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "audio-scatter"
version = "0.1.0"
description = "Interactive audio visualization tool for playing sounds by clicking on scatterplots in Jupyter"
readme = "README.md"
requires-python = ">=3.8"
license = "MIT"
authors = [
    {name = "Audio Scatter Contributors"}
]
dependencies = [
    "seaborn>=0.12.2",
    "matplotlib>=3.7.1",
    "numpy>=1.24.0",
    "ipython>=8.12.0",
    "pandas>=2.0.0",
    "plotly>=5.13.0",
    "pydub>=0.25.1",
    "ipywidgets>=8.0.0"
]

[project.urls]
Repository = "https://github.com/yourusername/audio_scatter"

[tool.hatch.build.targets.wheel]
packages = ["audio_scatter"] 